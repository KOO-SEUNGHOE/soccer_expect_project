name: Weekly Pipeline

# CLAUDE.md 지속 운영 파이프라인 설계:
#   - 매주 월요일: 지난 라운드 실제 결과 수집 -> 예측과 비교 -> predictions.db 갱신
#   - 매주 금요일: 다음 라운드 예측 생성 -> predictions.db 저장 -> README 배지 갱신
# cron은 UTC 기준이라 KST(UTC+9)로 환산해 시간을 지정한다.
on:
  schedule:
    - cron: "0 22 * * 0" # 매주 월요일 07:00 KST (일요일 22:00 UTC) - 결과 수집
    - cron: "0 20 * * 4" # 매주 금요일 05:00 KST (목요일 20:00 UTC) - 다음 라운드 예측
  workflow_dispatch:
    inputs:
      job:
        description: "수동 실행 시 돌릴 작업"
        required: true
        default: "predict"
        type: choice
        options: [collect, predict]

permissions:
  contents: write

jobs:
  collect_results:
    if: github.event_name == 'schedule' && github.event.schedule == '0 22 * * 0' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'collect')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # requirements.txt의 numpy==2.5.2가 Python>=3.12를 요구해 3.11에서는
          # 설치가 실패한다 (pip: "Requires-Python >=3.12"). 로컬 개발 환경(3.14)에
          # 맞춰 3.13으로 올려 호환성을 맞춘다.
          python-version: "3.13"
      - run: pip install -r requirements.txt
      # football-data.co.uk는 과거 결과만 제공하므로, 현재 시즌 CSV를 다시 받는 것만으로
      # "지난 라운드 실제 결과 수집"이 해결된다 (별도 결과 API 불필요).
      - run: python src/ingest/download.py --seasons 2526
      - run: python src/pipeline/collect_results.py
      - run: python src/evaluate/generate_badge.py
      - name: Commit updated logs/README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/E0_2526.csv logs/predictions.db README.md
          git diff --cached --quiet || git commit -m "chore: 지난 라운드 결과 반영 및 배지 갱신"
          git push

  predict_next_round:
    if: github.event_name == 'schedule' && github.event.schedule == '0 20 * * 4' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'predict')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python src/ingest/download.py --seasons 2526
      # 예정 경기 일정은 football-data.co.uk에 없어 football-data.org API가 필요하다.
      # 리포지토리 Settings > Secrets and variables > Actions에 FOOTBALL_DATA_API_KEY를
      # 등록해야 한다 (https://www.football-data.org/client/register 무료 발급).
      - run: python src/pipeline/predict_next_round.py
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      - name: Commit updated predictions DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/E0_2526.csv logs/predictions.db
          git diff --cached --quiet || git commit -m "feat: 다음 라운드 예측 생성"
          git push
